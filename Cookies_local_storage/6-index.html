<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Session Storage</title>
</head>
<body>
  <script>
    var availableItems = ['Shampoo', 'Soap', 'Sponge', 'Water'];

    function isSessionStorageAvailable() {
      try {
        var testKey = '__storage_test__';
        sessionStorage.setItem(testKey, testKey);
        sessionStorage.removeItem(testKey);
        return true;
      } catch (error) {
        return false;
      }
    }

    function addItemToCart(item) {
      sessionStorage.setItem(item, true);
    }

    function createStore() {
      var ul = document.createElement('ul');
      var i = 0;

      for (i = 0; i < availableItems.length; i += 1) {
        var li = document.createElement('li');
        li.textContent = availableItems[i];
        li.style.cursor = 'pointer';
        li.onclick = (function (item) {
          return function () {
            addItemToCart(item);
          };
        }(availableItems[i]));
        ul.appendChild(li);
      }

      document.body.appendChild(ul);
    }

    function displayCart() {
      if (sessionStorage.length === 0) {
        return;
      }

      var p = document.createElement('p');
      p.textContent = 'You previously had ' + sessionStorage.length + ' items in your cart';
      document.body.appendChild(p);
    }

    if (!isSessionStorageAvailable()) {
      alert('Sorry, your browser does not support Web storage. Try again with a better one');
    } else {
      createStore();
      displayCart();
    }
  </script>
</body>
</html>
